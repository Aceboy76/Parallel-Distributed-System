syntax = "proto3";
package cmaflow.v1;

message Empty {
}

message Count {
  int64 value = 1;
}

message RpcError {
  string code = 1;
  string message = 2;
  string details = 3;
}

message ChargeRequest {
  int64 amount_cents = 1;
  string customer_id = 2;
  string currency = 3;
  string idempotency_key = 4;
  int32 delay_ms = 5;
}

message ChargeResult {
  string charge_id = 1;
  string status = 2;
  int64 amount_cents = 3;
  string provider = 4;
}

message ConfigRequest {
  string config_id = 1;
}

message MonetizationConfig {
  string config_id = 1;
  string name = 2;
  double pass_score = 3;
  double upsell_score = 4;
  string proxy_metric = 5;
  string note = 6;
}

message ConfigList {
  repeated string configs = 1;
}

message CustomerRequest {
  int64 customer_id = 1;
}

message CustomerBatchRequest {
  repeated int64 customer_ids = 1;
}

message Customer {
  int64 id_student = 1;
  string gender = 2;
  string region = 3;
  string highest_education = 4;
  string disability = 5;
}

message CustomerBatch {
  repeated string customers = 1;
}

message EntitlementRequest {
  int64 customer_id = 1;
}

message Entitlement {
  int64 id_student = 1;
  double date_registration = 2;
  double date_unregistration = 3;
}

message RevenueQuery {
  string region = 1;
  int32 limit = 2;
}

message RegionRevenue {
  string region = 1;
  int64 transactions = 2;
  double revenue_total = 3;
  double revenue_mean = 4;
}

message RegionalRevenueReport {
  repeated string regions = 1;
  int64 transaction_total = 2;
  double revenue_total = 3;
}

message TransactionQuery {
  int64 customer_id = 1;
  string region = 2;
  int32 limit = 3;
}

message Transaction {
  int64 id_assessment = 1;
  int64 id_student = 2;
  string assessment_type = 3;
  string region = 4;
  double score = 5;
  string timestamp = 6;
}

message TransactionList {
  repeated string transactions = 1;
}

service ChargeService {
  rpc Charge (ChargeRequest) returns (ChargeResult);
}

service ConfigService {
  rpc GetConfig (ConfigRequest) returns (MonetizationConfig);
  rpc ListConfigs (Empty) returns (ConfigList);
}

service CustomerService {
  rpc BatchGetCustomers (CustomerBatchRequest) returns (CustomerBatch);
  rpc GetCustomer (CustomerRequest) returns (Customer);
}

service EntitlementService {
  rpc GetEntitlement (EntitlementRequest) returns (Entitlement);
}

service RevenueService {
  rpc ComputeRegionalRevenue (RevenueQuery) returns (RegionalRevenueReport);
  rpc StreamRegionalRevenue (RevenueQuery) returns (stream RegionRevenue);
}

service TransactionService {
  rpc CountTransactions (Empty) returns (Count);
  rpc ListTransactions (TransactionQuery) returns (TransactionList);
  rpc StreamTransactions (TransactionQuery) returns (stream Transaction);
}
